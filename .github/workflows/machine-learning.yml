
name: Ejecutar actividad de Machine Learning

on:
  push:
    branches:
      - developAE2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ejecutar-machine-learning-developAE2
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Comprobar archivos necesarios
        run: |
          test -f AE2.IPYNB
          test -d src/clases_po
          mkdir -p src/sincronicas/reportes

      - name: Ejecutar notebook
        run: |
          source .venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            AE2.IPYNB

      - name: Verificar reporte generado
        run: |
          test -s src/sincronicas/reportes/africa-synth-climate-deforestation-land-use-change-all.txt

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resumen-resultados-machine-learning
          path: src/sincronicas/reportes/africa-synth-climate-deforestation-land-use-change-all.txt
          if-no-files-found: error


