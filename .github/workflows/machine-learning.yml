
name: Ejecutar actividad de Machine Learning

on:
  push:
    branches:
      - developAE2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ejecutar-machine-learning-developAE2
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Localizar notebook
        run: |
          echo "Directorio del repositorio:"
          pwd
          echo "Notebooks encontrados:"
          find . -type f -iname "*.ipynb" -not -path "./.venv/*"

          NOTEBOOK="$(find . -type f -iname 'AE2.IPYNB' \
            -not -path './.venv/*' -print -quit)"

          if [ -z "$NOTEBOOK" ]; then
            echo "ERROR: No se encontró AE2.IPYNB."
            exit 1
          fi

          echo "Notebook seleccionado: $NOTEBOOK"
          echo "NOTEBOOK=$NOTEBOOK" >> "$GITHUB_ENV"

      - name: Ejecutar notebook
        run: |
          .venv/bin/jupyter nbconvert --version
          .venv/bin/jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 "$NOTEBOOK"

      - name: Verificar reporte generado
        run: |
          if ! find src/sincronicas/reportes \
            -maxdepth 1 -type f -name "*.txt" -size +0c \
            -print -quit | grep -q .; then
            echo "ERROR: No se generó ningún reporte TXT con contenido."
            echo "Archivos encontrados:"
            find src/sincronicas/reportes -maxdepth 1 -type f
            exit 1
          fi

          echo "Reporte TXT generado:"
          find src/sincronicas/reportes \
            -maxdepth 1 -type f -name "*.txt" -size +0c -print

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resumen-resultados-machine-learning
          path: src/sincronicas/reportes/*.txt
          if-no-files-found: error
